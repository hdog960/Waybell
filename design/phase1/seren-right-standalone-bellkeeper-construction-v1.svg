<title id="title">Seren Vale RIGHT — original individual Bellkeeper costume construction v1</title>
<desc id="description">A separate original editable right-facing profile of the human last High Bellkeeper Seren Vale. Dark chestnut pinned bun, navy bellkeeper mantle with restrained gold roads and a small bell brooch, structured cream collar and layered dress, ordinary brass bell tokens and near physical-right leather utility bag. Premium art direction only; not a full-resolution painterly master, game asset, 3D rig, completion status or final G1 approval.</desc>
