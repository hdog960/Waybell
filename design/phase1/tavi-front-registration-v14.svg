<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1560" viewBox="0 0 1080 1560" role="img" aria-labelledby="title desc">
<title id="title">WAYBELL Tavi straight-front fixed right-hand lantern and left-hip satchel construction v14</title>
<desc id="desc">An original painterly-inspired vector front-view Tavi garment anatomy study, with one eight-point Wayline brass clasp, right-hand hanging Echo Lantern at picture-left, physical left-hip two-buckle satchel at picture-right, teal asymmetrical cloak, restrained map roads, uniform boot buckles. This is concept design source, not the new Review 22 premium painting, game rig, or user G1 approval.</desc>
