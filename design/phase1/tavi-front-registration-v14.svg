<linearGradient id="leather" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#b98555"/><stop offset=".6" stop-color="#85553d"/><stop offset="1" stop-color="#503628"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#ffe7a0" stop-opacity=".85"/><stop offset=".6" stop-color="#fbb751" stop-opacity=".28"/><stop offset="1" stop-color="#e39a3c" stop-opacity="0"/></radialGradient>
