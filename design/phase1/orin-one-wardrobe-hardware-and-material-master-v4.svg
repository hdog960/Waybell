<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1200" viewBox="0 0 1850 1200" role="img" aria-labelledby="title description">
<title id="title">Orin one garment and equipment target: original illustrated material master v4</title>
<desc id="description">Original editable Phase 1 visual art illustrating a single proposed, FRONT-led Orin outfit for later genuine standalone painterly production. Four handcrafted enlarged art objects: broad moss-teal mountain route embroidered shoulder mantle with one eight-point compass pin, two buckle left-hip surveyor satchel with exactly two parchment rolls, right-hand plain wooden brass-capped measuring staff, and one pair of high-laced travel boots. Provisional decisions: no eyeglasses in base depiction, two chart rolls, actual equipment ownership specified. Not a new native premium painting, character turnaround, 3D sprite or owner G1 approval. Phase 2 game code remains locked.</desc>
