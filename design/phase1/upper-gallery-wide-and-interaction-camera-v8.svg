<text x="64" y="738" font-size="27" fill="#ffe0a4" font-family="Georgia,serif">PHASE 1 VISUAL CHECKS — NOT LIVE CAMERA TESTS</text>
<text x="65" y="775" font-size="18" fill="#d7e4dc" font-family="sans-serif">Wide art target: Tavi approximately 15–17% of full painting height; near Rootspool ring at ~60% frame width, far at ~79%.</text>
<text x="65" y="807" font-size="18" fill="#d7e4dc" font-family="sans-serif">Interaction target: a closer view may enlarge Tavi while keeping the current mandatory ring inside the clear central area.</text>
<text x="65" y="839" font-size="18" fill="#d7e4dc" font-family="sans-serif">All wheels and machinery motionless; no current or water before repair. Same room materials, terrain and landmark hierarchy.</text>
<text x="65" y="871" font-size="17" fill="#ffcf9c" font-family="sans-serif">Still missing: proven dynamic transitions, 3D scene fidelity, real touch occlusion and approved premium character turnaround.</text>
<text x="41" y="944" fill="#a6c9cb" font-size="13" font-family="sans-serif">Original editable vector composition plan only. Do not interpret as a runnable game, engine camera, iPhone screenshot or final G1 approval.</text>
