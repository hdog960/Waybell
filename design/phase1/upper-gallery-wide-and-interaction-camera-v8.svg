<title id="title">WAYBELL Review 12 — wide versus close Upper Spindle Galleries camera modes</title>
<desc id="desc">Source-controlled Phase 1 artistic staging reference showing a wide exploration composition and a closer interaction composition, a common room identity and proposed left and right thumb-safe zones. No runtime game camera.</desc>
