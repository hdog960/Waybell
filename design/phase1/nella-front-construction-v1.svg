<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1510" viewBox="0 0 1060 1510" role="img" aria-labelledby="title desc">
<title id="title">WAYBELL — Nella alone, original full-body front costume construction study</title>
<desc id="desc">One original standalone full-length human Nella front-view vector drawing in practical olive travel clothing and copper-red tied hair, grounded boots and light satchel. Early Phase 1 costume construction, NOT a premium painterly Nella master or player-party role, game sprite, or owner G1 approval.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8eacf"/><stop offset=".55" stop-color="#e7d2b2"/><stop offset="1" stop-color="#d9bd9a"/></linearGradient>
<linearGradient id="coat" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#8d9971"/><stop offset=".53" stop-color="#626d4d"/><stop offset="1" stop-color="#394b3d"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#df8851"/><stop offset=".55" stop-color="#a94e30"/><stop offset="1" stop-color="#683a2b"/></linearGradient>
<linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b28155"/><stop offset="1" stop-color="#604531"/></linearGradient>
<linearGradient id="shirt" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f7e9cc"/><stop offset="1" stop-color="#dcb88e"/></linearGradient>
