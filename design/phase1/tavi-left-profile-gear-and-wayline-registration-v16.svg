<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1100" viewBox="0 0 1720 1100" role="img" aria-labelledby="title desc">
<title id="title">Tavi LEFT profile physical-left satchel, far right-hand lantern and Wayline cloak registration v16</title>
<desc id="desc">An original editable Phase 1 character-art vector construction by the assistant, illustrating one full-length youthful Tavi turned strictly left. Physical-left map satchel appears near camera with two buckles, physical-right lantern farther behind the body, cape compass motif and asymmetric hem, with a separate register of continuing visual differences. This is not the real premium painting, not a game sprite, not a rig, and not G1 owner approval.</desc>
