<text x="72" y="1019" font-size="19" font-family="sans-serif" fill="#ffe0ab">Review 18: Tavi BACK-RIGHT has a genuine premium standalone painted candidate, but BACK-LEFT and FRONT-LEFT remain missing.</text>
<text x="72" y="1047" font-size="16" font-family="sans-serif" fill="#b9d1ce">This original editable SVG is a construction study only, not the accepted painting, a textured 3D model, game code, G1 approval or iPhone hardware proof.</text>
