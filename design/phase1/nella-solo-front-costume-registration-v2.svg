<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1540" viewBox="0 0 1120 1540" role="img" aria-labelledby="title desc">
<title id="title">Nella solo front design - copper hair, olive travel coat and mustard scarf</title>
<desc id="desc">Original WAYBELL Phase 1 editable one-person illustrated costume-construction source following Review26's genuine standalone painted Nella FRONT candidate. Hair is copper-red tied up with wild tendrils; practical olive jacket, mustard scarf, rolled sleeves, simple leather utility bag, patched trousers and laced boots. No teal Wayline cape, Echo Lantern, magic class or companions. This schematic is not the premium painting, 3D model, game code or final owner G1 approval.</desc>
