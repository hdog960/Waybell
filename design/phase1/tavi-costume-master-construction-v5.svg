<g fill="#c6dcd7" font-family="sans-serif" font-size="18">
<text x="79" y="302">Front-image LEFT = Tavi's physical RIGHT.</text><text x="79" y="327">Warm brass glass core; one attachment point.</text>
<text x="1314" y="323">One eight-point road compass.</text><text x="1314" y="348">No alternate collar charm by angle.</text>
<text x="1322" y="577">Front-image RIGHT = Tavi's physical LEFT.</text><text x="1322" y="601">Strap crosses chest, bag remains left.</text>
<text x="84" y="767">Unequal hem, same road-map embroidery.</text><text x="84" y="794">Do not mirror entire outfit for west views.</text>
<text x="1320" y="803">Keep same leather, cuff, sole and heel.</text><text x="1320" y="828">Ground shadow visible in every camera view.</text>
</g>
<text x="59" y="1054" fill="#e8d2a7" font-family="sans-serif" font-size="20">Original editable costume-construction reference. The standalone painterly front portrait is a separate chat artifact, not embedded in GitHub.</text>
<text x="61" y="1084" fill="#a3c4c7" font-family="sans-serif" font-size="16">Design v5 — NOT a completed orthographic turnaround, 3D model, animation rig, G1 approval or playable game. Phase 2 remains locked.</text>
