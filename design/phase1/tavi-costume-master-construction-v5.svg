<title id="title">WAYBELL — Tavi Master Costume Construction Study v5</title>
<desc id="desc">Original annotated vector costume construction reference based on the selected new full-length front portrait: cross-body strap and satchel on physical left, lantern on right hand, asymmetrical road-chart teal cloak, brass Wayline clasp, seven fixed costume tokens. Not final production rig or eight-view painted character set.</desc>
