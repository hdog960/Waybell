<title id="title">Seren Vale BACK — original independent human Bellkeeper costume construction v2</title>
<desc id="description">An original editable single full-figure BACK view design illustration of the adult HUMAN last High Bellkeeper Seren Vale, dark chestnut pinned bun and ribbon, layered ivory cream robe, navy mantle with one bell/branch insignia, two small brass bells, ordinary leather waist pouch, and worn boots. It is not a premium independently painted portrait, gameplay sprite, 3D rig, plot approval or Gate G1 acceptance.</desc>
