<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img" aria-labelledby="title desc">
<title id="title">WAYBELL — Tavi eight-direction fixed costume and physical inventory design master v12</title>
<desc id="desc">Original source-controlled original vector concept art for WAYBELL Phase 1 Review 20. A unique rear compass embroidered route-map topology, asymmetric cloak hem, satchel with two buckles and two map-roll pockets, a single right-hand hanging Echo Lantern, and boot straps and consistent color tokens. Eight original painterly direction concepts exist but this SVG does not make them production-ready or owner G1 approved.</desc>
