<g font-size="20" font-family="sans-serif" fill="#d3e3d9">
<text x="81" y="724">1. Player's cloak, shadow and boots must remain fully outside the shaded thumb zones.</text>
<text x="81" y="756">2. The NEXT required anchor must be large, unobstructed and inside the central clear region.</text>
<text x="81" y="788">3. Camera can reframe on approach; decorative far anchors do not all need to be visible at once.</text>
<text x="81" y="819">4. Wheel and spindle remain stopped; no flowing water in the first-visit mill.</text></g>
