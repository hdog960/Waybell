<linearGradient id="brass" x1="0" y1="0" x2="0.6" y2="1"><stop stop-color="#fff1c4"/><stop offset=".35" stop-color="#e9bc6f"/><stop offset="1" stop-color="#916332"/></linearGradient>
<pattern id="weave" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M0 25L25 0" stroke="#a0dac9" stroke-width=".7" opacity=".2"/><path d="M0 0L25 25" stroke="#052c3b" stroke-width=".7" opacity=".19"/></pattern>
</defs>
