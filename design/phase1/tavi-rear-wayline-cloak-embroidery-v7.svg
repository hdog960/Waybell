<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title description">
<title id="title">Tavi — original rear Wayline cloak material and embroidery topology reference v7</title>
<desc id="description">Single original source-controlled vector art-direction reference for the selected painted Tavi back view: asymmetrical deep-teal cloak with diagonal gold route stitching, centered brass eight-point compass, satchel on the character's physical left and lantern in right hand. Proposed art map, not a 3D UV or rig.</desc>
<defs>
