<title id="title">Orin LEFT profile: individually drawn physical garment identity illustration v3</title>
<desc id="description">One single elderly human Orin turning strictly picture left. Brown surveyor coat, broad teal moss shoulder shawl with a chart-road embroidery motif, physical-left front/near worn two-clasp satchel with rolled maps, far hand supporting an ordinary wooden survey staff, canvas and travel boots. Original editable vector art. NOT a premium painterly character image, production ready rig, or G1 approval. Spectacles remain explicitly unresolved between existing FRONT and RIGHT original paintings.</desc>
